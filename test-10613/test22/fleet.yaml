defaultNamespace: kube-system
helm:
  releaseName: rabbitmq-operator
  chart: oci://registry-1.docker.io/bitnamicharts/rabbitmq-cluster-operator

targetCustomizations:
  - name: istio-cni-values-override-configmap
    clusterSelector:
      matchLabels:
        istio-cni-values-override-configmap: 'true'
    helm:
      # Inline overrides
      values:
        asd:
          env: LT2
          loc: tt2
        dummyKey:
          foo: bar
      valuesFiles:
        - "values2.yaml"
        - "values.test3.yaml"


  - clusterSelector:
      matchLabels: {}
    doNotDeploy: true
